[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-platform"
version = "0.1.0"
description = "AI-Powered Quantitative Research Platform for US (NYSE/Nasdaq) & Australian (ASX) Equities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Quantitative Research Team" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "yfinance>=0.2.40",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ml = [
    "lightgbm>=4.5.0",
    "optuna>=4.0.0",
]

[project.scripts]
quant-platform = "quant_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
